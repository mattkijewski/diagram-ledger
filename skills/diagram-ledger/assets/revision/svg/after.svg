<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title description"><title id="title">Webhook delivery</title><desc id="description">Publisher sends events to an inbox. A worker delivers them to an external subscriber. The revision adds a quarantine for rejected events.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#48636b"/></marker></defs><rect width="1180" height="650" fill="#f7f8f3"/><g font-family="Arial, sans-serif" fill="#172e36"><text x="48" y="45" font-size="13" letter-spacing="2" fill="#42665f">DIAGRAM LEDGER / REVISION STUDY 01</text><text x="48" y="91" font-size="34" font-weight="700">Webhook delivery</text><text x="48" y="122" font-size="16" fill="#48636b">A precise change to an existing system map</text><g data-container="platform"><rect data-body="" x="310" y="155" width="560" height="405" rx="20" fill="#edf2eb" stroke="#b9c9c1"/><text x="334" y="181" font-size="13" font-weight="700" fill="#42665f">DELIVERY PLATFORM</text></g><g id="publisher" data-node="publisher" data-outside="platform"><rect data-body="" x="65" y="195" width="210" height="90" rx="12" fill="#fff" stroke="#789089"/><text x="85" y="231" font-size="18" font-weight="700">Publisher</text><text x="85" y="258" font-size="14" fill="#48636b">Emits an event</text></g><g id="inbox" data-node="inbox" data-within="platform"><rect data-body="" x="345" y="195" width="210" height="90" rx="12" fill="#fff" stroke="#789089"/><text x="365" y="231" font-size="18" font-weight="700">Event inbox</text><text x="365" y="258" font-size="14" fill="#48636b">Durable queue</text></g><g id="delivery" data-node="delivery" data-within="platform"><rect data-body="" x="625" y="195" width="210" height="90" rx="12" fill="#fff" stroke="#789089"/><text x="645" y="231" font-size="18" font-weight="700">Delivery worker</text><text x="645" y="258" font-size="14" fill="#48636b">Sends the webhook</text></g><g id="endpoint" data-node="endpoint" data-outside="platform"><rect data-body="" x="905" y="195" width="210" height="90" rx="12" fill="#fff" stroke="#789089"/><text x="925" y="231" font-size="18" font-weight="700">Subscriber</text><text x="925" y="258" font-size="14" fill="#48636b">External endpoint</text></g><g id="quarantine" data-node="quarantine" data-within="platform"><rect data-body="" x="625" y="425" width="210" height="90" rx="12" fill="#e1eee6" stroke="#789089"/><text x="645" y="461" font-size="18" font-weight="700">Quarantine</text><text x="645" y="488" font-size="14" fill="#48636b">Retains rejected events</text></g><g data-edge="publish" data-from="publisher" data-to="inbox"><path data-route="" d="M275 240H345" fill="none" stroke="#48636b" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="224" text-anchor="middle" font-size="13" fill="#48636b">event</text></g><g data-edge="consume" data-from="inbox" data-to="delivery"><path data-route="" d="M555 240H625" fill="none" stroke="#48636b" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="224" text-anchor="middle" font-size="13" fill="#48636b">pull</text></g><g data-edge="send" data-from="delivery" data-to="endpoint"><path data-route="" d="M835 240H905" fill="none" stroke="#48636b" stroke-width="2" marker-end="url(#arrow)"/><text x="870" y="224" text-anchor="middle" font-size="13" fill="#48636b">POST</text></g><g data-edge="reject" data-from="delivery" data-to="quarantine"><path data-route="" d="M730 285V425" fill="none" stroke="#48636b" stroke-width="2" marker-end="url(#arrow)"/><text x="770" y="354" text-anchor="middle" font-size="13" fill="#48636b">rejected</text></g><path d="M48 590H1132" stroke="#c7d2cb"/><text x="48" y="622" font-size="14" fill="#48636b">Solid arrow · event movement</text><text x="1132" y="622" text-anchor="end" font-size="14" fill="#48636b">Illustrative architecture · no delivery guarantee implied</text></g></svg>