<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="review-title review-desc">
  <title id="review-title">A review decision with explicit outcomes</title>
  <desc id="review-desc">A submitted draft goes to review. Approved drafts are published. Drafts that need changes are revised and return to review. This is an illustrative process.</desc>
  <defs>
    <marker id="review-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect width="1120" height="640" fill="#F8FAFC"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="48" y="64" font-size="30" font-weight="700">From draft to published</text>
    <text x="48" y="98" font-size="16" fill="#475569">A review loop with a clear approval decision</text>
    <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#review-arrow)">
      <path d="M280 272 H424"/>
      <path d="M664 272 H816"/>
      <path d="M544 352 V432"/>
      <path d="M424 480 H32 V144 H544 V192"/>
    </g>
    <rect x="64" y="224" width="216" height="96" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <path d="M544 192 L664 272 L544 352 L424 272 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <rect x="816" y="224" width="240" height="96" rx="6" fill="#ECFEFF" stroke="#155E75" stroke-width="2"/>
    <rect x="424" y="432" width="240" height="96" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
    <g font-size="18" text-anchor="middle">
      <text x="172" y="279">Submit draft</text>
      <text x="544" y="279">Approved?</text>
      <text x="936" y="279" fill="#155E75" font-weight="700">Publish</text>
      <text x="544" y="487">Revise draft</text>
    </g>
    <g font-size="16" fill="#475569">
      <text x="328" y="256">Review</text>
      <text x="724" y="256">Yes</text>
      <text x="560" y="396">No</text>
      <text x="400" y="128">Review again</text>
    </g>
    <text x="48" y="596" font-size="16" fill="#475569">Illustrative process · a requested revision returns to the same approval decision.</text>
  </g>
</svg>
